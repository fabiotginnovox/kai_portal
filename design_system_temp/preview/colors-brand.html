<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-page); font-family: var(--font-body,'DM Sans',sans-serif); }
  .row { display: flex; gap: 6px; margin-bottom: 8px; }
  .swatch { flex: 1; height: 48px; border-radius: var(--radius-md); position: relative; }
  .swatch-sm { height: 32px; }
  .label { font-size: 11px; color: var(--fg-secondary); margin-bottom: 4px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .token { font-size: 10px; color: var(--fg-tertiary); margin-top: 2px; }
  .group { margin-bottom: 16px; }
</style>
</head><body>
<div class="group">
  <div class="label">Forest (Primary)</div>
  <div class="row">
    <div class="swatch" style="background:var(--kai-forest-900)" title="900"></div>
    <div class="swatch" style="background:var(--kai-forest-800)" title="800"></div>
    <div class="swatch" style="background:var(--kai-forest-700)" title="700"></div>
    <div class="swatch" style="background:var(--kai-forest-600)" title="600"></div>
    <div class="swatch" style="background:var(--kai-forest-500)" title="500 ★"></div>
    <div class="swatch" style="background:var(--kai-forest-400)" title="400"></div>
    <div class="swatch" style="background:var(--kai-forest-300)" title="300"></div>
    <div class="swatch" style="background:var(--kai-forest-200)" title="200"></div>
    <div class="swatch" style="background:var(--kai-forest-100)" title="100"></div>
    <div class="swatch" style="background:var(--kai-forest-50);border:1px solid var(--border-default)" title="50"></div>
  </div>
</div>
<div class="group">
  <div class="label">Olive (Brand)</div>
  <div class="row">
    <div class="swatch" style="background:var(--kai-olive-900)"></div>
    <div class="swatch" style="background:var(--kai-olive-800)"></div>
    <div class="swatch" style="background:var(--kai-olive-700)"></div>
    <div class="swatch" style="background:var(--kai-olive-600)"></div>
    <div class="swatch" style="background:var(--kai-olive-500)"></div>
    <div class="swatch" style="background:var(--kai-olive-400)"></div>
    <div class="swatch" style="background:var(--kai-olive-300)"></div>
    <div class="swatch" style="background:var(--kai-olive-200)"></div>
    <div class="swatch" style="background:var(--kai-olive-100)"></div>
    <div class="swatch" style="background:var(--kai-olive-50);border:1px solid var(--border-default)"></div>
  </div>
</div>
<div class="group">
  <div class="label">Cream (Neutral)</div>
  <div class="row">
    <div class="swatch" style="background:var(--kai-cream-950)"></div>
    <div class="swatch" style="background:var(--kai-cream-800)"></div>
    <div class="swatch" style="background:var(--kai-cream-700)"></div>
    <div class="swatch" style="background:var(--kai-cream-600)"></div>
    <div class="swatch" style="background:var(--kai-cream-500)"></div>
    <div class="swatch" style="background:var(--kai-cream-400)"></div>
    <div class="swatch" style="background:var(--kai-cream-300)"></div>
    <div class="swatch" style="background:var(--kai-cream-200)"></div>
    <div class="swatch" style="background:var(--kai-cream-100)"></div>
    <div class="swatch" style="background:var(--kai-cream-50);border:1px solid var(--border-default)"></div>
  </div>
</div>
</body></html>
