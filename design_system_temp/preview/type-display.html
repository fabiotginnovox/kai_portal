<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: var(--bg-page); }
  .specimen { margin-bottom: 16px; }
  .spec-label { font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--brand-olive); margin-bottom: 4px; }
  .spec-text { font-family: var(--font-display); color: var(--fg-primary); line-height: var(--leading-snug); }
  .hero { font-size: var(--text-5xl); font-weight: 300; font-style: normal; font-variation-settings: 'opsz' 144, 'SOFT' 30; letter-spacing: -0.03em; }
  .hero em { font-style: italic; color: var(--accent-primary); }
  .h1  { font-size: var(--text-4xl); font-weight: 600; letter-spacing: -0.02em; }
  .h2  { font-size: var(--text-3xl); font-weight: 600; letter-spacing: -0.02em; }
  .h3  { font-size: var(--text-2xl); font-weight: 500; }
  hr { border: none; border-top: 1px solid var(--border-default); margin: 16px 0; }
</style>
</head><body>
  <div class="specimen">
    <div class="spec-label">Hero / Display — Fraunces Italic, 300</div>
    <div class="spec-text hero">Where does your company<br>stand in the <em>AI era?</em></div>
  </div>
  <hr>
  <div class="specimen">
    <div class="spec-label">H1 — Fraunces 600</div>
    <div class="spec-text h1">Three steps from diagnosis<br>to intelligent automation</div>
  </div>
  <hr>
  <div class="specimen">
    <div class="spec-label">H2 — Fraunces 600</div>
    <div class="spec-text h2">The five levels of AI maturity</div>
  </div>
  <hr>
  <div class="specimen">
    <div class="spec-label">H3 — Fraunces 500</div>
    <div class="spec-text h3">Four concrete deliverables</div>
  </div>
</body></html>
