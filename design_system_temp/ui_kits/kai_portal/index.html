    { label:'Level 3', name:'AI Active', desc:'AI is being deployed in multiple business functions with measurable ROI. A centre of excellence exists and governance frameworks are in early stages.' },

  ];

    <section style={{padding:'72px 40px', background:C.cream100}}>

/* ── ASSESSMENT FLOW ─────────────────────────────── */
const QUESTIONS = [
  { id:1, q:'How would you describe your organisation\'s current use of AI?', opts:['We don\'t use AI at all','We\'ve tried a few AI tools','AI is used in specific teams','AI is used across the business','AI is central to how we operate'] },
  { id:2, q:'Do you have a dedicated AI strategy or roadmap?', opts:['No, nothing formal','We\'re working on one','We have a draft strategy','Yes, a published strategy','Yes, and it\'s actively reviewed quarterly'] },
  { id:3, q:'How mature is your data infrastructure?', opts:['Data is scattered and inconsistent','We have some data systems but they\'re siloed','We have centralised data but limited access','Strong data infrastructure with good governance','Best-in-class data platform with real-time access'] },
  { id:4, q:'How do your teams feel about adopting AI?', opts:['Resistant or fearful','Sceptical but open','Curious and starting to experiment','Enthusiastic adopters','AI-first mindset is part of our culture'] },
];

function AssessmentScreen({ onNav }) {
  const [step, setStep] = React.useState(0);
  const [answers, setAnswers] = React.useState({});
  const [done, setDone] = React.useState(false);

  const q = QUESTIONS[step];
  const total = QUESTIONS.length;
  const pct = Math.round((step / total) * 100);

  const handleAnswer = (opt) => {
    const next = { ...answers, [q.id]: opt };
    setAnswers(next);
    if (step < total - 1) setTimeout(()=>setStep(s=>s+1), 280);
    else setTimeout(()=>setDone(true), 280);
  };

  if (done) return (
    <div style={{minHeight:'calc(100vh - 64px)', display:'flex', alignItems:'center', justifyContent:'center', background:C.cream100, padding:40}}>
      <div style={{background:C.forest700, borderRadius:24, padding:48, maxWidth:520, textAlign:'center'}}>
        <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.15em',color:C.olive400,marginBottom:16}}>Assessment complete</div>
        <div style={{fontFamily:'Fraunces,serif',fontSize:36,fontWeight:300,fontStyle:'italic',color:'#fff',marginBottom:16,lineHeight:1.2}}>
          Your AI Maturity Report is ready
        </div>
        <p style={{fontSize:15,color:C.forest200,lineHeight:1.65,marginBottom:32}}>
          Based on your responses, we've identified your AI maturity level and prepared a personalised roadmap for your organisation.
        </p>
        <button onClick={()=>onNav('report')} style={{
          background:C.olive600, color:'#fff', border:'none',
          padding:'14px 32px', borderRadius:999, fontSize:16, fontWeight:700,
          width:'100%',
        }}>View your report →</button>
        <button onClick={()=>onNav('home')} style={{
          background:'transparent', color:C.forest200, border:'none',
          padding:'12px', fontSize:14, marginTop:8, display:'block', width:'100%',
        }}>Back to home</button>
      </div>
    </div>
  );

  return (
    <div style={{minHeight:'calc(100vh - 64px)', background:C.cream100, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:40}}>
      {/* Progress */}
      <div style={{width:'100%', maxWidth:600, marginBottom:40}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <span style={{fontSize:12,color:C.cream500,fontWeight:600}}>Question {step+1} of {total}</span>
          <span style={{fontSize:12,color:C.cream500}}>{pct}% complete</span>
        </div>
        <div style={{height:4,background:C.cream300,borderRadius:999,overflow:'hidden'}}>
          <div style={{height:'100%',width:`${((step+1)/total)*100}%`,background:C.forest500,borderRadius:999,transition:'width 0.3s'}}/>
        </div>
      </div>

      <div style={{background:C.white, borderRadius:20, padding:'40px 48px', maxWidth:600, width:'100%', boxShadow:`0 8px 32px rgba(15,38,32,0.12)`}}>
        <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.15em',color:C.olive600,marginBottom:16}}>
          AI Maturity Assessment
        </div>
        <h2 style={{fontFamily:'Fraunces,serif',fontSize:26,fontWeight:600,color:C.cream950,marginBottom:28,lineHeight:1.3}}>
          {q.q}
        </h2>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {q.opts.map((opt,i)=>{
            const selected = answers[q.id] === opt;
            return (
              <button key={i} onClick={()=>handleAnswer(opt)} style={{
                padding:'13px 18px', border:`1.5px solid ${selected ? C.forest500 : C.cream300}`,
                borderRadius:10, background: selected ? C.forest50 : C.white,
                textAlign:'left', fontSize:14, color: selected ? C.forest600 : C.cream700,
                fontWeight: selected ? 600 : 400, cursor:'pointer',
                transition:'all 0.12s',
              }}>
                <span style={{
                  display:'inline-block', width:18, height:18, borderRadius:'50%',
                  border:`2px solid ${selected ? C.forest500 : C.cream400}`,
                  background: selected ? C.forest500 : 'transparent',
                  marginRight:10, verticalAlign:'middle', position:'relative', top:-1,
                }}/>
                {opt}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

        <div style={{maxWidth:560, margin:'0 auto'}}>
          <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.15em',color:C.olive400,marginBottom:16}}>Get started</div>
          <h2 style={{fontFamily:'Fraunces,serif',fontSize:44,fontWeight:300,fontStyle:'normal',fontVariationSettings:"'opsz' 72",color:'#fff',marginBottom:16,lineHeight:1.15}}>
            Find out where your company stands — and what to do next
          </h2>
          <p style={{fontSize:16,color:C.forest200,marginBottom:32,lineHeight:1.65}}>
            Take the free 10-minute AI maturity assessment and receive your personalised report.
          </p>
          <button onClick={()=>onNav('assessment')} style={{
            background:C.white,color:C.forest700,border:'none',
            padding:'15px 36px',borderRadius:999,fontSize:16,fontWeight:700,
          }}>Take the free assessment →</button>
        </div>
      </section>
      <Footer onNav={onNav} />
    </div>
  );
}

/* ── APP ─────────────────────────────────────────── */
function App() {
  const [screen, setScreen] = React.useState('home');
  return (
    <div>
      <Nav onNav={setScreen} current={screen} />
      {screen === 'home'       && <HomeScreen onNav={setScreen} />}
      {screen === 'assessment' && <AssessmentScreen onNav={setScreen} />}
      {screen === 'report'     && <ReportScreen onNav={setScreen} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
