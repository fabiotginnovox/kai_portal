<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon-32x32.png" />
    <title>KaiAssist | InnoVox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              kai: {
                black: '#050a06',
                dark: '#0d1610',
                card: '#131f16',
                accent: '#A3C644',
                accentHover: '#8ead3b',
                text: '#e0e7e1',
                muted: '#6b7f70'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'spin-slow': 'spin 12s linear infinite',
              'reverse-spin': 'reverse-spin 8s linear infinite',
              'pulse-soft': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scroll-vertical': 'scroll-vertical 40s linear infinite',
            },
            keyframes: {
              'reverse-spin': {
                from: { transform: 'rotate(360deg)' },
                to: { transform: 'rotate(0deg)' },
              },
              'scroll-vertical': {
                from: { transform: 'translateY(0)' },
                to: { transform: 'translateY(-50%)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        background-color: #050a06;
        color: #e0e7e1;
        font-family: 'Inter', sans-serif;
        margin: 0;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0d1610; 
      }
      ::-webkit-scrollbar-thumb {
        background: #1f3325; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #2a4532; 
      }
      .bg-grid {
        background-image: linear-gradient(to right, #131f16 1px, transparent 1px),
                          linear-gradient(to bottom, #131f16 1px, transparent 1px);
        background-size: 40px 40px;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://aistudiocdn.com/react@^19.2.1/",
        "react": "https://aistudiocdn.com/react@^19.2.1",
        "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
        "recharts": "https://aistudiocdn.com/recharts@^3.5.1"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
